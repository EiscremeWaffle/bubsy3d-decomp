name: Scaffold checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test executable verifier with synthetic inputs
        run: python -m unittest discover -s tests -v
      - name: Compile and test player-model selection
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/player_model -Isrc/game src/game/func_80054414.c src/game/func_80054488.c src/game/func_800546F4.c src/game/func_8005476C.c src/game/func_8005406C.c src/game/func_80054120.c src/game/func_8001DCE0.c src/game/func_800516F8.c src/game/func_8003AA1C.c src/game/func_8002269C.c src/game/func_80056678.c src/game/func_8005668C.c src/game/func_800566E8.c src/game/func_800536F4.c src/game/func_8002262C.c src/game/func_80022650.c src/game/func_8002E7D8.c src/game/func_80053A08.c src/game/func_8008E044.c src/game/func_8005D5A8.c src/game/component_transform.c src/game/move_requests.c src/player_model/player_model.c src/player_model/player_model_global.c src/player_model/player_vector_dot.c src/player_model/player_vector_range.c src/player_model/player_vector_transform.c src/player_model/player_actor_flags.c src/player_model/player_actor_state_table.c src/player_model/bubsy_actor_events.c src/player_model/bubsy_actor_update.c src/player_model/bubsy_death_state.c tests/test_player_model.c -o /tmp/test_player_model
          /tmp/test_player_model
      - name: Compile and test complete grounded handler
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/player_model src/player_model/bubsy_grounded_state.c src/player_model/bubsy_actor_update.c tests/test_bubsy_grounded_state.c -o /tmp/test_bubsy_grounded_state
          /tmp/test_bubsy_grounded_state
      - name: Compile and test complete movement preparation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game src/game/func_80025A98.c tests/test_move_preparation.c -o /tmp/test_move_preparation
          /tmp/test_move_preparation
      - name: Compile and test grounded stride producer
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/player_model src/player_model/bubsy_grounded_stride.c tests/test_bubsy_grounded_stride.c -o /tmp/test_bubsy_grounded_stride
          /tmp/test_bubsy_grounded_stride
      - name: Compile and test grounded deceleration producer
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/player_model src/player_model/bubsy_grounded_deceleration.c tests/test_bubsy_grounded_deceleration.c -o /tmp/test_bubsy_grounded_deceleration
          /tmp/test_bubsy_grounded_deceleration
      - name: Compile and test converted readable matches
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game src/game/func_80024EBC.c src/game/func_800250CC.c src/game/func_8004FF50.c src/game/func_8004FFEC.c src/game/func_8004EC20.c src/game/func_8004ECFC.c src/game/func_8004ED78.c src/game/func_80037B30.c src/game/func_80062E50.c tests/test_readable_matches.c -o /tmp/test_readable_matches
          /tmp/test_readable_matches
      - name: Compile and test readable transform wrappers
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror src/game/func_80053FA4.c src/game/func_800540BC.c src/game/func_800722C8.c tests/test_readable_transforms.c -o /tmp/test_readable_transforms
          /tmp/test_readable_transforms
      - name: Compile and test movement step production
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game src/game/func_80022944.c tests/test_move_step.c -o /tmp/test_move_step
          /tmp/test_move_step
      - name: Compile and test grounded temporary rotation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game -Isrc/player_model src/game/func_80054488.c src/game/func_800546F4.c src/game/func_800547C8.c src/game/func_800549E8.c src/game/func_80054AF0.c src/player_model/shared_actor_state_dispatch.c tests/test_grounded_rotation.c -o /tmp/test_grounded_rotation
          /tmp/test_grounded_rotation
      - name: Compile and test grounded basis reconstruction
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game src/game/func_80054488.c src/game/func_800542A4.c src/game/func_800550A4.c src/game/func_8005541C.c tests/test_grounded_basis.c -o /tmp/test_grounded_basis
          /tmp/test_grounded_basis
      - name: Compile and test movement initialization
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game src/game/func_8002611C.c tests/test_move_initializer.c -o /tmp/test_move_initializer
          /tmp/test_move_initializer
      - name: Compile and test movement setup
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/game src/game/func_80025FFC.c tests/test_move_setup.c -o /tmp/test_move_setup
          /tmp/test_move_setup