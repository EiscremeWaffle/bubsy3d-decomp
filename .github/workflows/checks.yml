name: Scaffold checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test executable verifier with synthetic inputs
        run: python -m unittest discover -s tests -v
      - name: Compile and test player-model selection
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/player_model -Isrc/game src/game/move_requests.c src/player_model/player_model.c src/player_model/player_model_global.c src/player_model/player_vector_dot.c src/player_model/player_vector_range.c src/player_model/player_vector_transform.c src/player_model/player_actor_flags.c src/player_model/player_actor_state_table.c src/player_model/bubsy_actor_events.c src/player_model/bubsy_actor_update.c src/player_model/bubsy_death_state.c tests/test_player_model.c -o /tmp/test_player_model
          /tmp/test_player_model